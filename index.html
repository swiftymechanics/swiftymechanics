<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift & Sons Auto Repairs - Coming Soon</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Poppins typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif']
                    },
                    colors: {
                        swift: {
                            blue: '#2a64b6',
                            navy: '#1a2639',
                            gray: '#f4f7f6'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-swift-navy text-white min-h-full flex flex-col justify-between font-sans antialiased selection:bg-swift-blue selection:text-white">

    <!-- Top Header -->
    <header class="p-6 md:p-8 max-w-7xl mx-auto w-full flex justify-between items-center">
        <div class="flex items-center gap-2 text-swift-blue font-semibold tracking-wide text-xs md:text-sm uppercase">
            <i class="fa-solid fa-location-dot"></i> Wigram, Christchurch
        </div>
        <a href="tel:0800000000" class="text-xs md:text-sm font-bold text-gray-300 hover:text-swift-blue transition flex items-center gap-2">
            <i class="fa-solid fa-phone text-swift-blue"></i> Coming Soon
        </a>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-xl mx-auto px-4 py-8 text-center flex flex-col items-center w-full">
        
        <!-- Logo Image Box -->
        <div class="mb-6 p-5 bg-white rounded-3xl border border-gray-100 shadow-2xl">
            <img src="https://iili.io/nBVqjDP.png" alt="Swift & Sons Auto Repair Logo" class="h-28 md:h-36 w-auto object-contain mx-auto">
        </div>

        <!-- Under Construction Badge -->
        <span class="bg-swift-blue text-white px-4 py-1.5 text-xs font-extrabold tracking-widest rounded-full mb-4 uppercase shadow-md flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> Under Construction
        </span>
        
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-4">
            Coming <span class="text-swift-blue">Soon</span>
        </h1>
        
        <p class="text-sm md:text-base text-gray-300 mb-8 max-w-md leading-relaxed">
            This Website is Under Construction. We'll be up and running as soon as possible.
        </p>

        <!-- Web3Forms Enquiry Box -->
        <div class="bg-white text-gray-800 border border-white/10 rounded-2xl p-6 md:p-8 w-full shadow-2xl text-left">
            <h4 class="text-xl font-extrabold text-swift-navy mb-1">Send an Enquiry</h4>
            <p class="text-xs text-gray-500 mb-6">If you had any questions, feel free to contact us using the below form.</p>

            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
                <!-- Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="ff84a284-5198-4309-8fd1-0953a1505de9">
                <!-- Honeypot Spam Protection -->
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-swift-blue outline-none text-sm">
                    </div>
                    <div>
                        <input type="tel" name="phone" placeholder="Phone Number" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-swift-blue outline-none text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <input type="text" name="vehicle" placeholder="Vehicle (e.g. Mazda Axela)" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-swift-blue outline-none text-sm">
                    </div>
                    <div>
                        <input type="text" name="rego" placeholder="Rego (Optional)" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-swift-blue outline-none uppercase text-sm">
                    </div>
                </div>

                <div>
                    <textarea name="message" rows="3" required placeholder="What needs doing? (e.g. WoF quote)" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-swift-blue outline-none text-sm"></textarea>
                </div>

                <button type="submit" class="w-full bg-swift-navy text-white font-bold py-3.5 rounded-lg hover:bg-gray-800 transition shadow-md flex justify-center items-center gap-2 text-sm">
                    Send Enquiry <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-gray-400 border-t border-white/10 bg-black/20">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 Swift & Sons Auto Repairs. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
